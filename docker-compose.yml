services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: dentify_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - dentify_pg_data:/var/lib/postgresql/data
      - ./schema_phase1.sql:/docker-entrypoint-initdb.d/01_schema.sql

  chromadb:
    image: chromadb/chroma:latest
    container_name: dentify_chromadb
    restart: unless-stopped
    ports:
      - "${CHROMA_PORT}:8000"
    volumes:
      - dentify_chroma_data:/data

  minio:
    image: minio/minio:latest
    container_name: dentify_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT}:9000"   # API
      - "${MINIO_CONSOLE_PORT}:9001"   # Console
    volumes:
      - dentify_minio_data:/data

volumes:
  dentify_pg_data:
  dentify_chroma_data:
  dentify_minio_data: