# nginx HOST — LXC webapp, /etc/nginx/sites-available/dentify (sejak frontend di Docker).
# Frontend : container dentify-frontend (127.0.0.1:8081) — caching & SPA fallback diatur di dalamnya
# Backend  : container dentify-backend  (127.0.0.1:8000)
# Endpoint alat ESP32 (POST /api/v1/device/captures) ikut lewat location /api/.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 25m;           # foto intraoral (frontend batasi 20 MB); default 1m -> 413

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # ditimpa: audit log ambil entri pertama
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;   # > RAG_SERVICE_TIMEOUT_SECONDS (180) — narasi Analisis AI laporan
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
